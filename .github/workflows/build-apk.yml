name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kode proyek
        uses: actions/checkout@v4

      - name: Siapkan Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Siapkan Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        env:
          JAVA_TOOL_OPTIONS: "-Djava.awt.headless=true"
        run: gradle assembleDebug --no-daemon --no-configuration-cache --stacktrace

      - name: Build Debug APK
        env:
          JAVA_TOOL_OPTIONS: "-Djava.awt.headless=true"
        run: gradle assembleDebug -Djava.awt.headless=true --no-daemon --stacktrace

      - name: Unggah APK sebagai Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: "**/app/build/outputs/apk/debug/app-debug.apk"
